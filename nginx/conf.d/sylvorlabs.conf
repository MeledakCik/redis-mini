server {
    listen 80;
    server_name sylvorlabs.web.id www.sylvorlabs.web.id;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name sylvorlabs.web.id www.sylvorlabs.web.id;

    ssl_certificate /etc/letsencrypt/live/sylvorlabs.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sylvorlabs.web.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://reporter:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
