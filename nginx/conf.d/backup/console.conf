server {
    listen 80;
    server_name console.kasyaf.id vector.kasyaf.id;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name console.kasyaf.id vector.kasyaf.id;
    ssl_certificate /etc/letsencrypt/live/console.kasyaf.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.kasyaf.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://console:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
