events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;

  # --- ANTI-DDOS: nolak permukaan info & flood volumetric sebelum sampai Next.js ---
  server_tokens off; # jangan bocorin versi nginx di header/error page (Server: nginx/1.x)

  # Rate limit umum per-IP (halaman & API biasa) dan zona lebih ketat khusus /api/auth/*
  # (login/callback OAuth/credentials) yang paling sering jadi target credential stuffing.
  # $binary_remote_addr diisi dari CF-Connecting-IP kalau request lewat Cloudflare (lihat
  # blok map & set_real_ip_from di bawah) — bukan IP edge Cloudflare, tapi IP visitor asli.
  limit_req_zone $binary_remote_addr zone=general_zone:10m rate=15r/s;
  limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=3r/s;
  limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

  # --- Cloudflare real IP (WAJIB kalau proxy Cloudflare sudah di-enable, lihat CLOUDFLARE_SETUP.md) ---
  # Selama origin (VPS) masih diakses via Cloudflare orange-cloud, koneksi TCP nginx keliatannya
  # datang dari IP edge Cloudflare, bukan IP visitor asli. Baris di bawah bilang ke nginx:
  # "kalau request datang dari salah satu IP range Cloudflare ini, percaya header
  # CF-Connecting-IP sebagai IP asli" — dipakai buat rate limit & $remote_addr yang akurat.
  # Daftar lengkap & auto-update: https://www.cloudflare.com/ips/
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header CF-Connecting-IP;

  server {
    listen 80;
    server_name console.kasyaf.id vector.kasyaf.id;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }
  server {
    listen 443 ssl;
    http2 on;
    server_name console.kasyaf.id;
    ssl_certificate /etc/letsencrypt/live/console.kasyaf.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.kasyaf.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Endpoint login paling sensitif — limit lebih ketat + burst kecil, extra defense-in-depth
    # di atas rate limit per-email di lib/auth.js dan per-IP di middleware.js.
    location ~ ^/api/auth/(callback/credentials|register) {
      limit_req zone=auth_zone burst=5 nodelay;
      limit_conn conn_zone 10;
      proxy_pass http://console:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      limit_req zone=general_zone burst=30 nodelay;
      limit_conn conn_zone 20;
      proxy_pass http://console:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
  server {
    listen 443 ssl;
    http2 on;
    server_name vector.kasyaf.id;
    ssl_certificate /etc/letsencrypt/live/console.kasyaf.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.kasyaf.id/privkey.pem;
    location = / { return 302 /dashboard; }
    location / {
      limit_req zone=general_zone burst=30 nodelay;
      limit_conn conn_zone 20;
      proxy_pass http://qdrant:6333;
    }
  }
}
