events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  server {
    listen 80;
    server_name console.kasyaf.id vector.kasyaf.id;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }
  server {
    listen 443 ssl;
    http2 on;
    server_name console.kasyaf.id;
    ssl_certificate /etc/letsencrypt/live/console.kasyaf.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.kasyaf.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
      proxy_pass http://console:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
  server {
    listen 443 ssl;
    http2 on;
    server_name vector.kasyaf.id;
    ssl_certificate /etc/letsencrypt/live/console.kasyaf.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.kasyaf.id/privkey.pem;
    location = / { return 302 /dashboard; }
    location / { proxy_pass http://qdrant:6333; }
  }
}
