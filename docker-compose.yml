services:
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
      - "16379:6379"
    networks:
      - kasyaf-net
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.9.0
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    networks:
      - kasyaf-net
    restart: unless-stopped

  console:
    build: .
    env_file:
      - .env
    environment:
      - AUTH_TRUST_HOST=true
    expose:
      - "3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - console_data:/app/data
    depends_on:
      - redis
      - qdrant
    networks:
      - kasyaf-net
    restart: unless-stopped
  reporter:
    build: ./phising-report-vps
    container_name: phishing-reporter
    expose:
      - "3000"
    networks:
      - kasyaf-net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/letsencrypt:/var/lib/letsencrypt
    depends_on:
      - console
      - reporter
    networks:
      - kasyaf-net
    restart: unless-stopped

volumes:
  redis_data:
  qdrant_data:
  console_data:

networks:
  kasyaf-net:
    driver: bridge
