services:
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --appendonly yes
    volumes:
      - redis_data:/data
    # PUBLISHED KE HOST (bukan cuma "expose"): Redis-as-a-Service ini emang butuh customer
    # connect LANGSUNG dari app mereka sendiri (lihat lib/redis-public-host.js) — beda dari
    # "console" (web app) yang trafiknya wajib lewat nginx+Cloudflare. Proteksinya di layer
    # aplikasi (ACL password per-tenant, bukan proxy CDN), sama seperti Redis Cloud/Upstash.
    # WAJIB: hostname yang dipakai REDIS_PUBLIC_HOST/REDIS_PUBLIC_URL harus hostname terpisah
    # yang GREY CLOUD (DNS only, tidak di-proxy Cloudflare) — lihat docs/CLOUDFLARE_SETUP.md.
    # Cloudflare standar cuma proxy HTTP(S), raw TCP 6379 akan timeout kalau hostname-nya
    # orange cloud (persis kasus yang bikin Railway app gagal connect sebelum fix ini).
    ports:
      - "6379:6379"
    networks:
      - kasyaf-net
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.9.0
    volumes:
      - qdrant_data:/qdrant/storage
    # Sama alasannya kayak redis di atas — lihat lib/qdrant-public-host.js. Customer connect
    # langsung ke port 6333 (REST API Qdrant), jadi harus published, bukan cuma expose.
    ports:
      - "6333:6333"
    networks:
      - kasyaf-net
    restart: unless-stopped

  console:
    build: .
    env_file:
      - .env
    environment:
      - AUTH_TRUST_HOST=true
      - AUTH_URL=https://console.kasyaf.id
    # TIDAK published ke host — hanya nginx yang boleh ngomong ke console lewat network
    # internal kasyaf-net (reverse proxy pattern), console gak pernah diakses langsung dari
    # luar VPS. Ini bagian dari hardening Task 2 (satu-satunya pintu masuk publik ke web app
    # adalah nginx:80/443, yang di depannya ada Cloudflare).
    expose:
      - "3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - console_data:/app/data
    depends_on:
      - redis
      - qdrant
    networks:
      - kasyaf-net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    # Satu-satunya service yang published ke port standar 80/443 buat trafik WEB
    # (console.kasyaf.id / vector.kasyaf.id) — ini yang harus di-proxy Cloudflare
    # (orange cloud). Redis (6379) & Qdrant (6333) di atas published terpisah karena
    # protokolnya bukan HTTP dan customer connect langsung, bukan lewat nginx ini.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    depends_on:
      - console
    networks:
      - kasyaf-net
    restart: unless-stopped

volumes:
  redis_data:
  qdrant_data:
  console_data:

networks:
  kasyaf-net:
    driver: bridge
