services:
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --appendonly yes
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - kasyaf-net
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.9.0
    volumes:
      - qdrant_data:/qdrant/storage
    expose:
      - "6333"
    networks:
      - kasyaf-net
    restart: unless-stopped

  console:
    build: .
    env_file:
      - .env
    environment:
      - AUTH_TRUST_HOST=true
      - AUTH_URL=https://console.kasyaf.id
    expose:
      - "3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - console_data:/app/data
    depends_on:
      - redis
      - qdrant
    networks:
      - kasyaf-net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    depends_on:
      - console
    networks:
      - kasyaf-net
    restart: unless-stopped

volumes:
  redis_data:
  qdrant_data:
  console_data:

networks:
  kasyaf-net:
    driver: bridge
