server {
    listen 80;
    server_name sylvorlabs.web.id www.sylvorlabs.web.id;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name sylvorlabs.web.id www.sylvorlabs.web.id;
    ssl_certificate /etc/letsencrypt/live/sylvorlabs.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sylvorlabs.web.id/privkey.pem;
    location / {
        proxy_pass http://reporter:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
